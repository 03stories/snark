name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # attach the zip to GitHub Releases on tags

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Package (strips manifest key, validates references)
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: snark-store-zip
          path: dist/*.zip
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
