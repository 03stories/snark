name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # attach the zip to GitHub Releases on tags

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Prepare release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node tools/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/snark-release-notes.md"
      - name: Package (strips manifest key, validates references)
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: snark-store-zip
          path: dist/*.zip
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: ${{ runner.temp }}/snark-release-notes.md
          files: dist/*.zip
          fail_on_unmatched_files: true
